scenario_id: test-scenario
type: scenario
derives_from: []
relations: []
implementation:
  language: typescript
  primary_bc: test
  generates: []
infrastructure:
  services:
    postgres:
      image: postgres:15
      ports:
        - "5432:5432"
      environment:
        POSTGRES_USER: testuser
        POSTGRES_PASSWORD: testpass
        POSTGRES_DB: testdb
      volumes:
        - postgres_data:/var/lib/postgresql/data
    redis:
      image: redis:7
      ports:
        - "6379:6379"
volumes:
  postgres_data: {}